name: travel_support_mvp
description: Flutter MVP for travel application, management, evidence upload, and settlement preparation.
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  intl: ^0.20.2
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  path_provider: ^2.1.5
  pdfx: ^2.9.2
  printing: ^5.13.3
  js: ^0.7.1
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.7
  flutter_svg: ^2.3.0
  google_maps_flutter: ^2.17.1
  google_sign_in: ^6.2.2
  kakao_flutter_sdk_user: ^2.0.0+1
  flutter_naver_login: ^2.1.1
  flutter_secure_storage: ^10.3.1
  archive: ^4.0.9
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/logo/
    - assets/map/
    - assets/card/
    - assets/localmoney/
    - assets/spot/
    - assets/illust/region/
    - assets/illust/place/
    - assets/region_hero/
    - assets/mall_icons/
    - assets/magnet/
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/PretendardVariable.ttf
